<header class="flex items-start justify-between gap-4 p-5 pb-3">
  <h2 [id]="titleId()" class="text-subtitle font-semibold">{{ title() }}</h2>
  <button
    app-button
    variant="ghost"
    size="sm"
    square
    type="button"
    class="-mt-1 -mr-2 text-muted"
    aria-label="Cerrar"
    i18n-aria-label="@@dialog.close"
    (click)="dialogRef.close()"
  >
    <svg lucideX [size]="20" aria-hidden="true"></svg>
  </button>
</header>
<div class="overflow-y-auto px-5 pb-2">
  <ng-content />
</div>
<footer class="flex flex-col-reverse gap-2 p-5 pt-4 sm:flex-row sm:justify-end">
  <ng-content select="[actions]" />
</footer>
