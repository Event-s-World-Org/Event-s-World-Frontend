<label [for]="id" [class]="labelClasses">
  {{ label() }}
  @if (required()) {
    <span class="text-rejected" aria-hidden="true">*</span>
  }
</label>
@if (type() === 'textarea') {
  <textarea
    [id]="id"
    rows="4"
    [class]="textareaClasses"
    [value]="value()"
    [placeholder]="placeholder() ?? ''"
    [disabled]="disabled()"
    [attr.required]="required() || null"
    [attr.aria-invalid]="errorText() ? true : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (blur)="markTouched()"
  ></textarea>
} @else {
  <input
    [id]="id"
    [type]="type()"
    [class]="fieldClasses"
    [value]="value()"
    [placeholder]="placeholder() ?? ''"
    [attr.autocomplete]="autocomplete() ?? null"
    [attr.inputmode]="inputMode() ?? null"
    [disabled]="disabled()"
    [attr.required]="required() || null"
    [attr.aria-invalid]="errorText() ? true : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (blur)="markTouched()"
  />
}
@if (hint()) {
  <p [id]="hintId" [class]="hintClasses">{{ hint() }}</p>
}
@if (errorText()) {
  <p [id]="errorId" [class]="errorClasses">{{ errorText() }}</p>
}
