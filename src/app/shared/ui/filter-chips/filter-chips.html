@for (option of options(); track option.value) {
  <button
    type="button"
    class="inline-flex min-h-9 items-center gap-2 rounded-pill border px-4 text-secondary font-semibold transition-colors duration-150 pointer-coarse:min-h-11"
    [class]="
      value() === option.value
        ? 'border-primary bg-primary text-on-primary'
        : 'border-glass-border bg-glass text-text hover:bg-surface-2'
    "
    [attr.aria-pressed]="value() === option.value"
    (click)="toggle(option.value)"
  >
    {{ option.label }}
    @if (option.count !== undefined) {
      <span class="tabular-nums opacity-80">{{ option.count }}</span>
    }
  </button>
}
